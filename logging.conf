# --- Logging Configuration for rusty_h265_converter ---

# Default log level: TRACE, DEBUG, INFO, WARN, ERROR
log_level = INFO

# Log file path (relative to working directory or absolute path)
log_file = /Users/maildev/coding/rusty_h265_converter/rusty_h265_converter.log

# Maximum number of rotated log files to retain
number_of_files = 5

# Maximum size of each log file before rotation (supports MB, KB, GB, or raw bytes)
max_file_size = 20MB

# Log line format template
# Tokens: YYYY-mm-dd, HH:MM:SS.millisec, [LOG_LEVEL], <log message>, [<stacktrace if error>]
format = YYYY-mm-dd HH:MM:SS.millisec [LOG_LEVEL] <log message> [<stacktrace if error>]
